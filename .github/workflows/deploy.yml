name: Deploy to the server

on: [push]

jobs: 
  deploy:
    runs-on: ubuntu-latest
    steps:

      - name: Copying all the code
        uses: actions/checkout@v4
      
      - name: Deploy to server
        run: |
          echo "Deploying to server..."

      - name: auth using gcloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_KEY }}
      
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: 'latest'
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/portfolio:latest .

      - name: Push Docker image
        run: |
          docker push ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/portfolio:latest

      - name: Accessing the VM
        run: |
          gcloud compute ssh ${{ secrets.GCP_VM_NAME }} --zone=${{ secrets.GCP_ZONE }} \
            --command="gcloud auth configure-docker ${{ secrets.GCP_REGION }}-docker.pkg.dev && \
            sudo docker pull ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/portfolio:latest && \
            sudo docker stop portfolio || true && \
            sudo docker rm portfolio || true && \
            sudo docker run -d -p 80:80 --name portfolio ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/my-repo/portfolio:latest" \
            -- -o StrictHostKeyChecking=no
  
     
